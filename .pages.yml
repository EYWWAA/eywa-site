media:
  - name: photos
    label: Photos du site
    input: assets
    output: assets
    extensions: [png, jpg, jpeg, webp]

content:
  - name: accueil
    label: Accueil
    type: file
    path: content/accueil.json
    format: json
    fields:
      - name: hero
        label: Premier écran
        type: object
        fields:
          - { name: titre, label: Grand titre, type: text }
          - { name: texte, label: Texte de présentation, type: text }
          - { name: bouton, label: Texte du bouton devis, type: string }
          - { name: sous_bouton, label: Texte sous le bouton, type: string }
          - { name: avis, label: Avis client, type: string }
          - { name: photo, label: Photo principale, type: image, options: { media: photos } }
          - { name: alt_photo, label: Description de la photo, type: string }
          - { name: etiquette_photo, label: Texte sur la photo, type: text }
      - name: presentation
        label: Section présentation
        type: object
        fields:
          - { name: titre, label: Titre, type: text }
          - { name: texte, label: Texte, type: text }
      - name: zone
